# Example of the file install.sh writes as config/models.ini (it uses the filenames it actually downloaded).
# The section name is the model name used in config/skills.json; the path is the path INSIDE the container,
# where the project's models/ folder is mounted read-only at /models.
[minicpm5]
model = /models/llm/MiniCPM5-2B-Q4_K_M.gguf

[gemma4]
model = /models/llm/gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf

# Optional (install.sh --with-deep): only used for "think hard" requests
[vibethinker]
model = /models/llm/VibeThinker-3B.Q4_K_M.gguf
